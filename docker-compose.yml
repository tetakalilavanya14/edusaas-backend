# ==============================================================================
# Containerized Deployment Reference
# ==============================================================================
# Docker socket is mounted so coding assessments (dockerService.js) can run
# sandboxed student code inside runner containers.
# Persistent volumes preserve uploads and assessment evidence across restarts.
# ==============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vayvora-api
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      NODE_ENV: production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./uploads:/app/uploads
      - ./assessment-evidence:/app/assessment-evidence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vayvora-worker
    env_file:
      - .env
    environment:
      APP_ENV: production
      NODE_ENV: production
    volumes:
      - ./uploads:/app/uploads
      - ./assessment-evidence:/app/assessment-evidence
    command: ["node", "worker.js"]
    restart: unless-stopped